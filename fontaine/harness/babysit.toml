# LIVE — token-GRPO phase-2 R0 smoke (local GPU, unit fontaine-grpo-r0;
# pre-reg posts/2026-08-13-prereg-token-grpo-phase2-run.md FINALIZED
# 14:55Z, HEAD fa739e9 + pre-reg 8548969; launcher
# fontaine/scripts/launch_grpo_phase2_r0.sh). 2 steps: step-0 held-out
# greedy eval (seeds 200-219, the pairing baseline) then 2x (64-episode
# sampled wave at T=1.0 -> z-filter -> option-B gradient step) + the
# endpoint eval. First heartbeat rows are EVAL rows (no loss key);
# training step rows carry loss/ratio/KL facts.
[[run]]
name = "grpo_phase2_r0"
kind = "train-jsonl"
host = "local"
pgrep = "sim.grpo_loop"
pgrep_min = 1
gpu_indices = [0]
gpu_mem_min_mib = 4000
jsonl = "outputs/sim/grpo_phase2/train.jsonl"
total_steps = 2
probe_key = "eval_reward_mean"
vram_key = "vram_gib"
boundary = "R0 = 2 steps, gate <= 3.5 GPU-h INCLUDING launch 1's ~0.9 (crashed rc 1 15:51:26Z at the first gradient step, cuda/cpu device bug in grpo_objective_sums — fixed 9ffc1c1, pre-reg addendum 1; baseline 1.868 + 2/20 held-out successes banked from launch 1). LAUNCH 2 crashed 17:12:17Z: OOM at Adam-state init (_foreach_sqrt, 77 GiB — text stack measured ~3.9B params fp32, a ~4B-class model; baseline reproduced bit-identically + full gradient accumulation was clean). Fixes d0b9a44: foreach=False, CPU-staged anchor swap, expandable_segments; ops gate 3.5 -> 5.5 GPU-h (addendum 2), ladder total 35 unchanged. LAUNCH 3 17:56:31Z on d0b9a44 (baseline ~18:08, wave 0 ~18:45, step-1 row ~19:0x — carries the Adam-step survival verdict + first loss/ratio/KL facts; projected peak ~68-70 GiB vs the 75 vram gate, an OOM here = option B measured-infeasible on 1xH100 -> option-A fallback via NEW pre-reg, in-channel). At rc: R0 boundary reads per pre-reg (measured pace; ON-SURFACE signal median group std >= 0.25 cm AND >= 8/16 nondeg groups else STOP; step-1 mean_ratio in [0.95,1.05] + clip_fraction < 0.2 else STOP; KL line set from R0 scale; VRAM < 75). rc=3 = a mechanized tripwire fired (heartbeat 'tripwire' row names it) — stop + re-scope in-channel, rows kept for diagnosis. On green boundary: R1 resumes step_0002.pt with --total-steps 17."
anchors = [
    "sampled waves: 8 fresh seeds x 8 draws at T=1.0, train stream 1000+8*step; eval greedy masked seeds 200-219",
    "loop mechanizes the §7 tripwires (strike/NaN/collapse/violence/competence) — exit 3, never silent",
    "arm-B measured rollout pace 0.63 min/episode is the prior; fp32 text stack + sampled streams may run 1.0-1.3x that",
    "step rows: loss/mean_ratio/clip_fraction/approx_kl/anchor_kl/median_group_std/knockaway_frac; eval rows: eval_reward_mean/_delta_*",
]
[[run.gates]]
kind = "vram_max_gib"
value = 75.0

