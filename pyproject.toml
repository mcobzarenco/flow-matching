[project]
name = "flow-matching"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=0.40",
    # lerobot[dataset] leaves av unconstrained; the <16 cap is ours and is
    # the only thing pinning the decode stack's ffmpeg ABI.
    "av>=15,<16",
    # async = grpcio+protobuf for the policy-server/robot-client split
    # (pi05 rig rollouts: 4B doesn't fit the laptop GPU, the box serves).
    "lerobot[async,dataset,feetech,smolvla,viz]>=0.4",
    "matplotlib>=3.11.1",
    # SO-101 digital twin (sim/): closed-loop eval next to bijou inference.
    "mujoco>=3.2",
    "pillow>=12.3.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "wandb>=0.28.1",
]

[tool.uv]
# lerobot 0.6 caps transformers<5.6, but Gemma 4 Unified (gemma4_unified)
# needs >=5.14. SmolVLA verified working under 5.14.1 (deterministic
# chunk-MAE eval via `python -m bijou.eval --smolvla`). Drop once lerobot
# lifts its cap.
override-dependencies = [
    "transformers>=5.14",
]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "pyright[nodejs]>=1.1.411",
    # Keep in lockstep with the ruff bundled by Zed's extension (editor
    # diagnostics come from that binary): version skew means default-rule
    # skew, e.g. 0.16 added ISC004/DTZ005/TRY004 to the defaults.
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
# The repo is used in-place (no installed package): put the root on
# sys.path so tests import bijou exactly like `python -m bijou.train` does.
pythonpath = ["."]
testpaths = ["tests"]
# --strict-markers: a typo'd marker (e.g. @pytest.mark.gup) is an error,
# not a silently-unfiltered test. Tier convention: tests/README.md.
addopts = "--strict-markers"
markers = [
    "gpu: needs a CUDA device; excluded from the default run, included by `check.py --gpu`",
]

[tool.pyright]
include = ["bijou", "sim", "tests", "probes", "check.py"]
# convert_benchy and probe_phantom_volume are PEP-723 scripts running in
# their own uv envs (trimesh, xatlas); their imports don't exist in the
# project venv.
exclude = ["sim/convert_benchy.py", "sim/probe_phantom_volume.py"]
# Local Any-stubs for untyped C-extension packages (mujoco). pyright picks
# up ./typings automatically; kept explicit for greppability.
stubPath = "typings"
venvPath = "."
venv = ".venv"
# Curated strict-ish set (see docs/code-styleguide.md). Full strict mode is
# off the table: lerobot/transformers are untyped, and the reportUnknown*
# family would drown real signal at every third-party call.
#
# Parameter annotations are required (return annotations are enforced by
# ruff's ANN2xx rules; pyright has no "missing return annotation" rule,
# only unknown-type inference checks).
reportMissingParameterType = "error"
# Overriding a base method silently is how signature drift ships: mark it.
reportImplicitOverride = "error"
# Stale escape hatches must not outlive the problem they suppressed.
reportUnnecessaryTypeIgnoreComment = "error"
# Dead-logic detectors: a check the types make impossible is a bug or a
# wrong annotation, either way worth a loud failure.
reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportMatchNotExhaustive = "error"
reportPropertyTypeMismatch = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
deprecateTypingAliases = true
# Infer list/dict/set element types strictly instead of widening to Unknown.
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
# NOT enabled, deliberately:
# - reportUninitializedInstanceVariable: torch's register_buffer pattern
#   (class-level Tensor annotation + register_buffer in __init__) trips it
#   on every module with buffers.
# - reportUnknown*/reportMissingTypeStubs: untyped third-party boundary.

[tool.ruff]
# baselines/ is an independent uv project (own pins, own env) - the main
# repo's toolchain doesn't police it.
extend-exclude = ["baselines"]

[tool.ruff.lint]
# Curated rule families (rationale in docs/code-styleguide.md):
#   ANN  annotations everywhere            B    bugbear correctness traps
#   A    builtin shadowing                 C4   comprehension hygiene
#   COM  trailing commas (one-arg-per-line when split; formatter-stable,
#        verified: COM812 fix -> format reaches a fixpoint)
#   ERA  no commented-out code             FBT  no positional booleans
#   I    sorted/grouped imports (matches the editor's organize-imports
#        code action; the formatter deliberately never touches imports)
#   N    pep8 naming                       PERF trivial perf traps
#   PIE/PLE/PLW  misc correctness          PTH  pathlib over os.path
#   RET  return-statement hygiene         RUF  ruff-native (incl. mutable
#   SIM  simplifications                        dataclass defaults)
#   UP   modern syntax
# Plus two named rules we want regardless of ruff's shifting defaults:
#   ISC004  unparenthesized implicit concat in collections (missing-comma
#           detector; whole-ISC stays off — ISC001 conflicts with the
#           formatter and ISC002 would flag every argparse help string)
#   TRY004  raise TypeError from type checks (whole-TRY stays off — TRY003
#           penalizes the long, loud error messages we deliberately write)
extend-select = [
    "A",
    "ANN",
    "B",
    "C4",
    "COM",
    "ERA",
    "FBT",
    "I",
    "N",
    "PERF",
    "PIE",
    "PLE",
    "PLW",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "ISC004",
    "TRY004",
]
ignore = [
    # Any is deliberate at untyped third-party boundaries (transformers,
    # lerobot models/tokenizers/items).
    "ANN401",
    # COM812 is the one COM rule we want; COM819 (banned trailing comma)
    # never fires with the formatter, COM818 is fine to keep.
    # Positional booleans in CALLS: torch idioms (requires_grad_(False),
    # train(False)) make this unactionable; definitions stay covered by
    # FBT001/FBT002.
    "FBT003",
    # `import torch.nn.functional as F` is the universal torch convention.
    "N812",
    # Rebinding a loop variable (`path = path.expanduser()`) is idiomatic
    # shadowing, not an error.
    "PLW2901",
]
# Math typography in docstrings is intentional, not homoglyph confusion.
allowed-confusables = ["−", "–", "×", "σ", "τ", "ε", "γ", "β", "α", "λ"]

[tool.ruff.lint.isort]
# Explicit rather than inferred from directory layout: scratch scripts in
# gitignored outputs/ import bijou too and should sort it identically.
known-first-party = ["bijou"]


