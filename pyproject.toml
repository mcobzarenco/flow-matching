[project]
name = "flow-matching"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=0.117.0",
    "av>=15,<16",
    "bitsandbytes>=0.49.2",
    "ipython>=9.15.0",
    "lerobot[dataset,feetech,smolvla,viz]>=0.4",
    "pillow>=12.3.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]

[tool.uv]
# lerobot 0.6 caps transformers<5.6, but Gemma 4 Unified (gemma4_unified)
# needs >=5.14. SmolVLA verified working under 5.14.1: the deterministic
# eval (eval_smolvla.py --episodes 0 --stride 60, seed 42) reproduces
# chunk MAE 11.825181 bit-for-bit. Drop this once lerobot lifts its cap.
override-dependencies = [
    "transformers>=5.14",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "ruff>=0.15.21",
]

[tool.pyright]
include = ["fmatch", "gemma4", "main.py", "check.py", "eval_smolvla.py"]
venvPath = "."
venv = ".venv"
# Parameter annotations are required (return annotations are enforced by
# ruff's ANN2xx rules; pyright has no "missing return annotation" rule,
# only unknown-type inference checks).
reportMissingParameterType = "error"

[tool.ruff]
extend-exclude = ["MNIST"]

[tool.ruff.lint]
# flake8-annotations: require explicit argument and return annotations.
# ANN401 (no Any) is off: we use Any deliberately at untyped third-party
# boundaries (transformers models/tokenizers).
extend-select = ["ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.extend-per-file-ignores]
# Legacy code predating the annotation requirement; clean up opportunistically.
"fmatch/*" = ["ANN"]
"main.py" = ["ANN"]
"check.py" = ["ANN"]
"eval_smolvla.py" = ["ANN"]
